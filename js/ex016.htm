<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex016</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: rgb(201, 201, 201);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        form{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px 0 rgba(0,0,0,0.5)
        }

        label{
            display: block;
            margin-bottom: 5px;
        }

        input{
            width: 100%;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        .radio, .checkbox{
            width: 10%;
        }

        input#botao{
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            background-color: blue;
            color: white;
            cursor: pointer;
        }

        input#botao:hover{
            background-color: rgb(0, 0, 131);
        }
    </style>
</head>

<body>

    <form id="formulario">
        <h1>Formulario</h1>
        <label>Nome: </label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome">

        <label>Email: </label>
        <input type="email" name="email" id="email" placeholder="Digite seu email">

        <label>Idade: </label>
        <input type="number" name="idade" id="idade" placeholder="Digite sua idade">

        <label>Senha: </label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha">

        <label>Confirmar senha: </label>
        <input type="password" name="confirmarSenha" id="confirmarSenha" placeholder="Confirme sua senha">

        <label>Genero: </label>
        <input class="radio" type="radio" name="genero" value="Masculino">Masculino
        <input class="radio" type="radio" name="genero" value="Feminino">Feminino

        <label>Atividades: </label>
        <input class="checkbox" type="checkbox" name="atividades" value="Bike">Bike
        <input class="checkbox" type="checkbox" name="atividades" value="Nadar">Nadar
        <input class="checkbox" type="checkbox" name="atividades" value="Skate">Skate

        <input id="botao" type="submit" value="Enviar">
    </form>
    <script>

        let form = document.getElementById('formulario')

        form.addEventListener('submit', function (event) {
            event.preventDefault()           
            alert('Formulario enviado!!')
            form.reset()
        })

    </script>
</body>

</html>
